[workspace]
resolver = "2"
members = [
    "crates/cairn-accumulator",
    "crates/cairn-chain",
    "crates/cairn-primitives",
    "crates/cairn-crypto",
    "crates/cairn-explorer",
    "crates/cairn-http",
    "crates/cairn-ledger",
    "crates/cairn-net",
    "crates/cairn-node",
    "crates/cairn-store",
    "crates/cairn-wallet",
]

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cairnchain/cairn"

# No version on the internal ones. They are never published to a registry, so
# a version here would only be a second place the number lives, and the
# release is now cut from that number: two of them is two that can disagree.
[workspace.dependencies]
cairn-accumulator = { path = "crates/cairn-accumulator" }
cairn-chain = { path = "crates/cairn-chain" }
cairn-crypto = { path = "crates/cairn-crypto" }
cairn-explorer = { path = "crates/cairn-explorer" }
cairn-http = { path = "crates/cairn-http" }
cairn-ledger = { path = "crates/cairn-ledger" }
cairn-net = { path = "crates/cairn-net" }
cairn-node = { path = "crates/cairn-node" }
cairn-store = { path = "crates/cairn-store" }
cairn-primitives = { path = "crates/cairn-primitives" }
blake3 = { version = "1", default-features = false, features = ["std"] }
ed25519-dalek = { version = "3", default-features = false, features = ["alloc", "fast", "zeroize"] }
getrandom = "0.3"
thiserror = "2"
zeroize = { version = "1", features = ["zeroize_derive"] }
hex = "0.4"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
arithmetic_side_effects = "deny"
indexing_slicing = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

# Tests mine, and mining is blake3. Forty two test files search for a real
# nonce, some of them up to four million tries at a time, and an unoptimised
# blake3 is not the same program: measured on this machine, 130 815 tries a
# second against 1 723 081, a factor of thirteen. The chain's own suite took
# fourteen and a half minutes of which almost all of it was that.
#
# So the dependencies are built optimised whatever the profile, and the test
# targets with them. What is deliberately left alone is `debug-assertions`,
# which stays on: several of this codebase's guards are `debug_assert!`, and a
# handover that named one note twice was caught by one of them and by nothing
# else. Speed here must not be bought by turning off the checks that only run
# here.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 2

[profile.test.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
overflow-checks = true
