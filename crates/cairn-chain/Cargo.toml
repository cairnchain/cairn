[package]
name = "cairn-chain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
cairn-crypto.workspace = true
cairn-ledger.workspace = true
cairn-primitives.workspace = true
thiserror.workspace = true

[dev-dependencies]
# For `tests/pool.rs`, which builds a cold witness to tie the place price to
# the floor rate it was measured at.
cairn-accumulator.workspace = true
cairn-crypto.workspace = true
# For the relay-cost test in `tests/pool.rs`, which counts bytes hashed rather
# than timing anything. Only the test build asks for it.
cairn-primitives = { workspace = true, features = ["count-hashing"] }
