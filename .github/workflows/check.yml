# What has to hold before anything is merged or released.
#
# The point is not that it passes here. The point is that anyone reading a
# change can see it passed, on three operating systems, without taking our
# word for it or having a Rust toolchain of their own.

name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called by release.yml, so that what has to hold before a merge is the same
  # text as what has to hold before a download. Two copies of a gate are two
  # gates that drift, and the one that drifts is the one nobody reads.
  workflow_call:

# Nothing here writes anything. This is the workflow that runs this
# repository's own code, and the build scripts of everything it depends on,
# on every push and every pull request. The repository's default token is
# read-only today, but that is a setting in a web page rather than a line
# anyone reviewing a change can see, and the other two workflows already say
# it here.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A warning in this code is a mistake that has not been noticed yet.
  RUSTFLAGS: -D warnings

jobs:
  # Formatting and lints are the same everywhere, so they run once.
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the toolchain this repository pins
        run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked

  # Tests run on all three, because a node is meant to run on all three and
  # the differences that matter are the ones nobody thought to look for:
  # file locks, path separators, socket behaviour.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the toolchain this repository pins
        run: rustup show
      - run: cargo test --workspace --release --locked

  # The same tests again, in a debug build, because the release job above
  # compiles every debug_assert out of existence. Some of those stand on
  # invariants whose first visible sign of failure would otherwise be a node
  # disagreeing with the network: what undoing a block restores, what the hot
  # set and the index over it agree on. An assertion nothing ever runs is a
  # comment. One machine is enough: what this catches is not platform
  # specific.
  assertions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the toolchain this repository pins
        run: rustup show
      - run: cargo test --workspace --locked

  # A node has to build for the machines people actually run servers on, and
  # those are not the machines this is developed on.
  #
  # What is shipped is what `release.yml` builds: two Apple targets, musl on
  # x86_64 and on arm64, and Windows on msvc. This list and that one disagreed
  # in both directions. `aarch64-unknown-linux-musl` is released and was
  # checked nowhere before the release that builds it, so the first sign of it
  # breaking would have been a failed release rather than a failed pull
  # request, and an arm64 machine is exactly the cheap server the musl choice
  # is made for. It is checked here now, on an arm64 runner rather than by
  # cross-compiling, and with the musl toolchain installed as `release.yml`
  # installs it: `blake3` reaches for a C compiler to build its assembly and a
  # musl target wants a musl one, which a native runner does not have either.
  #
  # Two more released targets are covered by the `test` job above, which is
  # stronger than a check: `windows-latest` is msvc and `macos-latest` is
  # Apple silicon, so both are built and run rather than type-checked. The
  # fifth, `x86_64-apple-darwin`, is checked here on the same macOS runner,
  # since Apple's compiler cross-compiles to Intel without anything installed.
  # Every target `release.yml` ships is now reached before a change lands
  # rather than at the release that builds it.
  #
  # `x86_64-pc-windows-gnu` is not released and stays: it is the only thing
  # anywhere that says whether this builds under the gnu toolchain, which is
  # what somebody building it themselves on Windows is likely to have.
  cross:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the toolchain this repository pins
        run: rustup show
      - run: rustup target add ${{ matrix.target }}
      # The same step `release.yml` runs for the same targets, and for the
      # same reason: `blake3` reaches for a C compiler to build its assembly,
      # and a musl target wants a musl one. A native arm64 runner has `gcc`
      # and that is not it. Written here assuming the native runner would be
      # enough, which it is not: the job said `failed to find tool
      # "aarch64-linux-musl-gcc"` exactly as cross-compiling had.
      - name: Install the musl linker
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - run: cargo check --workspace --target ${{ matrix.target }} --locked
