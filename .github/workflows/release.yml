# Builds the programs people download, in public, from a tagged commit.
#
# A binary is the one part of this project you cannot read. Everything here
# exists to narrow that gap: the build runs on machines nobody involved
# controls, from a commit anyone can check out, with a log anyone can read,
# and it signs an attestation saying which commit and which workflow produced
# each file. `gh attestation verify` checks that against GitHub rather than
# against us, so trusting the download does not mean trusting us.
#
# Archive names carry no version, so
# https://github.com/cairnchain/cairn/releases/latest/download/cairn-linux-x86_64.tar.gz
# is a link that always hands over the newest release and can be written into
# the website once. The version is inside: in the folder name, in a VERSION
# file, and in what each program prints. Every release keeps its own copy of
# the files under its own tag, so an old one stays reachable for good.
#
# Run it by pushing a tag:
#
#     git tag -a v0.1.0 -m "..." && git push origin v0.1.0

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, for a dry run
        required: true

# Granted per job rather than here. Everything this file does apart from the
# last step is a build, and a build that can write releases and mint an OIDC
# token is a build whose every dependency can too.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-apple-silicon
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-intel
            os: macos-latest
            target: x86_64-apple-darwin
          # musl rather than glibc: a binary linked against the glibc of the
          # machine that built it refuses to start on an older one, which is
          # exactly the machine a cheap server is.
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # A tag that disagrees with the version in Cargo.toml produces programs
      # that report one number while the release is named another. Cheaper to
      # refuse here than to explain later.
      - name: Check the tag against the version
        if: github.event_name == 'push'
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in Cargo.toml" >&2
            exit 1
          fi

      - name: Install the toolchain this repository pins
        run: rustup show

      - run: rustup target add ${{ matrix.target }}

      - name: Install the musl linker
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools

      # --locked so the release is built from the dependency versions in
      # Cargo.lock and not from whatever resolved newest this morning.
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --bin cairnd --bin cairn-wallet --bin cairn-explorer

      - name: Gather what goes in the archive
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          fi
          # The folder carries the version; the archive does not, so the
          # link on the website never has to be edited again.
          folder="cairn-${version}-${{ matrix.name }}"
          echo "FOLDER=$folder" >> "$GITHUB_ENV"
          echo "ARCHIVE=cairn-${{ matrix.name }}" >> "$GITHUB_ENV"
          mkdir "$folder"
          suffix=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            suffix=".exe"
          fi
          for program in cairnd cairn-wallet cairn-explorer; do
            cp "target/${{ matrix.target }}/release/${program}${suffix}" "$folder/"
          done
          cp LICENSE-MIT LICENSE-APACHE "$folder/"
          cp deploy/DOWNLOAD.txt "$folder/README.txt"
          printf '%s\n' "$version" > "$folder/VERSION"

      - name: Archive
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "${ARCHIVE}.zip" "$FOLDER" > /dev/null
          else
            tar czf "${ARCHIVE}.tar.gz" "$FOLDER"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.name }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # The only job that writes anything: the release, and the attestation that
    # says which build produced it.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The tag message becomes the release notes, so the tag has to
          # arrive with its annotation rather than as a bare ref.
          fetch-depth: 0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: downloads
          merge-multiple: true

      # One file listing every archive and its hash, so a download can be
      # checked with a command every operating system already has.
      - name: Write the checksums
        working-directory: downloads
        run: |
          sha256sum *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS

      # Signed by GitHub, tying each file to this commit and this workflow.
      # Verified with:
      #   gh attestation verify <file> --repo ${{ github.repository }}
      # Recorded in a public transparency log, so only for a real release.
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        if: github.event_name == 'push'
        with:
          subject-path: "downloads/*.tar.gz, downloads/*.zip"

      # What the tag says, followed by the same closing note every time: how
      # to check these files without having to believe anyone.
      - name: Write the release notes
        run: |
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          cat deploy/RELEASE_FOOTER.md >> notes.md
          cat notes.md

      - name: Publish
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            downloads/*
