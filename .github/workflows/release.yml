# Builds the programs people download, in public, from a tagged commit.
#
# A binary is the one part of this project you cannot read. Everything here
# exists to narrow that gap: the build runs on machines nobody involved
# controls, from a commit anyone can check out, with a log anyone can read,
# and it signs an attestation saying which commit and which workflow produced
# each file. `gh attestation verify` checks that against GitHub rather than
# against us, so trusting the download does not mean trusting us.
#
# Archive names carry no version, so
# https://github.com/cairnchain/cairn/releases/latest/download/cairn-linux-x86_64.tar.gz
# is a link that always hands over the newest release and can be written into
# the website once. The version is inside: in the folder name, in a VERSION
# file, and in what each program prints. Every release keeps its own copy of
# the files under its own tag, so an old one stays reachable for good.
#
# There is nothing to run. A release happens when the version in Cargo.toml
# changes on the main branch, and that is the whole ceremony: the number is
# where a version already lives, so making it also the thing that publishes
# removes both a step somebody has to remember and the failure it invited:
# a tag naming one version over programs that report another. The tag is made
# here, from the number, so the two cannot disagree.
#
# What that left was the remembering. Nobody changed the number for a hundred
# commits and two weeks, and among them were fixes to money: a wallet that
# lost where its fallen notes sat, an account file anybody with a login could
# read, a node whose listening port closed in silence. None of it was
# downloadable, because a release waited on somebody thinking of it.
#
# So the number is worked out here too, once a day, from the one thing that
# decides whether a release is worth making: whether what people download
# would be different. That is a fact about files, and it is checked against
# the crates the three programs are actually built from and the pages the
# explorer serves, so a change to the markdown sources of the documents or to
# the fuzzing harness moves nothing.
#
# Deliberately not from the words in commit messages. `fix:` and `feat:` say
# what an author meant, and a signed artifact anybody can download should turn
# on what changed rather than on how it was labelled: a source change written
# up as `test:` would publish nothing and nobody would notice. The labels
# decide the size of the step and never whether to take it, because the size
# is a judgement and the taking is a fact.
#
# The tag message is the commit that changed the number, which is where the
# reason for a release is already written, followed by any commit the release
# carries that was merged after it.
#
# One run, one commit. A run checks, builds, attests and tags the commit it
# was started for, and no other. The attestation cannot say anything else: it
# names the commit GitHub started the run for, which is fixed before the run
# does anything. So a scheduled run that moves the number builds nothing
# itself. It writes the number on main and starts a second run there, which
# finds a version with no release and releases it, as a push of that commit
# would. The scheduled run used to build the version commit it had just made,
# and every release it published was attested as built from the commit below
# the one it was built from and tagged on, whose Cargo.toml says the version
# before.

name: release

on:
  push:
    branches: [main]
  # Once a day, rather than on every merge. A release is a thing people
  # download: one carrying a day's work is worth more than six carrying one
  # change each, and a version bump in every pull request would have them all
  # fighting over the same line of Cargo.toml.
  schedule:
    - cron: "0 6 * * *"
  # By hand for a dry run, which names a version and publishes nothing; and by
  # the scheduled run, with no version, to release the one it has just written.
  # A dispatch is the one kind of run the token a workflow is given may start.
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to build for a dry run, which publishes nothing. Left empty,
          the run is asked what a push is asked: whether the version on main
          has a release yet.
        required: false
        default: ""

# Granted per job rather than here. Everything this file does apart from the
# last step is a build, and a build that can write releases and mint an OIDC
# token is a build whose every dependency can too.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# One run at a time, the rest waiting rather than cancelled. Two runs that
# overlapped both found the same tag missing, both built, both recorded an
# attestation in the public log, and the second failed at the tag.
# Waiting, the second run decides after the first has tagged, and finds the
# work done. What it costs: GitHub keeps one run waiting and replaces it with
# a newer one, so a scheduled run still waiting when a push arrives is not
# made, and the day's release waits for the next day's. The run a scheduled
# run starts to release its version can be replaced the same way, and that
# costs nothing: the push that replaces it finds the version without a
# release, and releases it together with its own commit.
#
# It does not keep merges out, and cannot: a merge is not a run of this file.
# The checks take two hours, and anything merged meanwhile moves main from
# under the version commit. That is `bump`'s to deal with.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Whether this push publishes anything, and under what number.
  #
  # A push that did not change the version is an ordinary push and stops here.
  # So is one whose version already has a release, which is what makes this
  # safe to re-run: publishing is decided by what does not yet exist rather
  # than by what just happened. A dispatch that names no version is asked the
  # same question, and that is how a scheduled run's version gets released.
  decide:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.look.outputs.release }}
      version: ${{ steps.look.outputs.version }}
      bump: ${{ steps.look.outputs.bump }}
      dry: ${{ steps.look.outputs.dry }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - id: look
        shell: bash
        env:
          DRY_RUN_OF: ${{ inputs.version }}
        run: |
          # Read from inside [workspace.package] rather than from the first
          # line in the file that starts with the word: the release is named
          # after this number, and a second `version` key added above it one
          # day would rename the release without anyone editing this file.
          version=$(awk '/^\[workspace\.package\]/{s=1;next} /^\[/{s=0} s && /^version[[:space:]]*=/{split($0,a,"\"");print a[2];exit}' Cargo.toml)
          if [ -z "$version" ]; then
            echo "no version under [workspace.package] in Cargo.toml" >&2
            exit 1
          fi
          # The number as it stands. A scheduled run that decides to move it
          # leaves the next one to `bump`, which works it out from main as it
          # is when the checks have passed rather than as it was now.
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$DRY_RUN_OF" ]; then
            echo "dry=true" >> "$GITHUB_OUTPUT"
            echo "bump=false" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "a dry run of $DRY_RUN_OF, publishing nothing"
            exit 0
          fi
          echo "dry=false" >> "$GITHUB_OUTPUT"
          if ! git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            # Somebody set the number, by hand or through a scheduled run's
            # version commit, and it has no release yet: this commit is it.
            echo "bump=false" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "v$version has no release yet, so this run makes it, from $GITHUB_SHA"
            exit 0
          fi

          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "bump=false" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "v$version is already released; nothing to do"
            exit 0
          fi

          # A scheduled run, and the number it found is already published. So
          # the question is whether anything people download would differ.
          #
          # Asked of the crates the three programs are built from, worked out
          # rather than written down: a list here would be a second place the
          # membership lives, and a crate added to the workspace with the
          # others would not be in it. `cairn-docs` and the fuzzing harness are
          # in the workspace and in no binary, so nothing they do is a reason
          # to publish.
          built=$(
            cargo tree -p cairn-node -p cairn-wallet -p cairn-explorer \
              --prefix none --no-dedupe --edges normal 2>/dev/null \
              | awk '{print $1}' | grep '^cairn-' | sort -u
          )
          if [ -z "$built" ]; then
            echo "could not work out which crates a release is built from" >&2
            exit 1
          fi
          # The sources and the manifest, and not the whole crate directory.
          # A crate's tests, benchmarks and examples sit beside its sources and
          # are in none of the three binaries, so a day of nothing but tests
          # changes nothing anybody downloads. Counting them would have made
          # this file decide on whether the repository changed, which is a
          # different question from the one written above it, and the last
          # merge before this was written was tests and nothing else.
          #
          # `build.rs` is named although no crate here has one: a crate that
          # grows one is running code at build time, which is exactly the kind
          # of change this has to see.
          paths=""
          for crate in $built; do
            paths="$paths crates/$crate/src crates/$crate/Cargo.toml crates/$crate/build.rs"
          done
          # The lock file and the toolchain as well: neither is a crate of ours
          # and a change to either changes the programs. And the root manifest,
          # which holds the release profile and every dependency's features,
          # neither of which the lock records.
          #
          # And the files the explorer serves, which are compiled into it: its
          # own header says the binary is the site. A fix to the script every
          # explorer hands the public, or to a paper it serves, changed what
          # people download while this said that nothing had. The papers are
          # the rendered pages and their stylesheets, not the markdown they are
          # rendered from, which is in no program.
          # `release_decision_sees_every_file_a_program_is_built_from` in the
          # explorer's tests holds this list against what the sources include.
          paths="$paths Cargo.lock rust-toolchain.toml Cargo.toml web docs/*.html docs/*.css"
          echo "built from:" $built

          # Unquoted on purpose: this is a list of paths and not one path.
          # shellcheck disable=SC2086
          if git diff --quiet "v$version" HEAD -- $paths; then
            echo "bump=false" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "nothing a release is built from has changed since v$version"
            exit 0
          fi

          # Something did. The next number is `bump`'s to work out, from main
          # as it stands once the checks have passed: what is merged in the
          # meantime goes into the version too, and can move it further.
          echo "bump=true" >> "$GITHUB_OUTPUT"
          echo "release=false" >> "$GITHUB_OUTPUT"
          echo "v$version is released and the programs have changed since, so a version is written once the checks pass"

  # The checks, before anything is built for people to download.
  #
  # Nothing enforced this. check.yml and this file both start from the same
  # push and never look at each other, and the branch requires no status
  # check, so a version bump published signed binaries whether or not the
  # tests, the lints and the formatting had passed. The attestation says which
  # commit and which workflow produced a file, and a reader hears "this is a
  # good build" in it. It never said that. Now the release cannot happen
  # unless it is true.
  #
  # A scheduled release passes through here twice. Once in the scheduled run,
  # on the commit it found, before any number is written; and once in the run
  # it starts, on the version commit itself, which is what is then built. The
  # second is the one the release rests on: main can move while the first
  # runs, and the version commit is then made on a tree the first never saw.
  #
  # Called rather than copied: the gate a release passes is the same text as
  # the gate a merge passes.
  verify:
    needs: decide
    if: >-
      needs.decide.outputs.release == 'true'
      || needs.decide.outputs.bump == 'true'
      || needs.decide.outputs.dry == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml

  # The number, written down once the checks have passed, and then released by
  # a run of its own.
  #
  # After `verify` and not before it, so that no version is written on a tree
  # whose checks failed. And the commit it makes is what the release notes and
  # the tag message are read from further down, which is why its message is
  # the account of what changed rather than the word "bump": for a release
  # carrying a day's work the reason is plural, and the reason is what
  # somebody deciding whether to take a download is looking for.
  #
  # On main as it stands when the checks end, not on the commit they ran on.
  # They take two hours, and a version commit made on the commit this run
  # started from was refused as soon as anything had been merged in between:
  # the run of 27 September failed that way with four merges behind it, and
  # nothing tried again, so no release was made while the fixes that most
  # needed one went on being merged. The commits it lands on have not been
  # through this run's checks, and they do not have to be: the run started
  # below checks the version commit itself before building it, and builds
  # nothing if they fail. If main moves again between reading it and pushing,
  # the version is written again on the new tip, a few times at most. If what
  # was merged set a version itself, this writes none: that one is released by
  # the run for its own commit.
  #
  # A push, not a pull request. A pull request opened with this token has no
  # checks run against it, because a push or a pull request made with the
  # token a workflow is given deliberately starts no workflow, and a release
  # proposal nobody can verify is worse than none. The same rule means the
  # push below starts no run of this file either. A dispatch is the one
  # exception GitHub makes, so the release run is started by one, and it
  # finds the version with no release and makes it, from the version commit,
  # exactly as a push of that commit would.
  bump:
    needs: [decide, verify]
    if: needs.decide.outputs.bump == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For the dispatch that starts the run releasing the version.
      actions: write
    outputs:
      sha: ${{ steps.write.outputs.sha }}
      version: ${{ steps.write.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - id: write
        shell: bash
        env:
          WAS: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          checked="$GITHUB_SHA"
          attempt=0
          while :; do
            attempt=$((attempt + 1))
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            now=$(awk '/^\[workspace\.package\]/{s=1;next} /^\[/{s=0} s && /^version[[:space:]]*=/{split($0,a,"\"");print a[2];exit}' Cargo.toml)
            if [ "$now" != "$WAS" ]; then
              echo "::notice::main was set to version $now while the checks ran on $checked, so this run writes none: v$now is released by the run for the commit that set it"
              exit 0
            fi
            if [ "$(git rev-parse HEAD)" != "$checked" ]; then
              echo "::notice::main moved while the checks ran on $checked; the version is written on $(git rev-parse HEAD), which the run started below checks before building it"
              git log --no-merges --format='  %h %s' "$checked..HEAD"
            fi

            # How far the number moves is the one thing the commit messages
            # decide, because it is a judgement rather than a fact, and it is
            # the author who made it. Read to the end rather than with
            # `grep -q`, which stops at the first match and can leave git
            # writing into a closed pipe, which `pipefail` reports as no match.
            step=patch
            if git log "v$WAS"..HEAD --no-merges --format=%s \
              | grep -E '^feat(\(|!|:)' > /dev/null; then
              step=minor
            fi
            major=${WAS%%.*}
            rest=${WAS#*.}
            minor=${rest%%.*}
            patch=${rest#*.}
            if [ "$step" = minor ]; then
              minor=$((minor + 1))
              patch=0
            else
              patch=$((patch + 1))
            fi
            next="$major.$minor.$patch"
            echo "v$WAS is released and the programs have changed since, so this is v$next"

            # Inside [workspace.package] and nowhere else, which is the same
            # place and the same reason the number is read from above.
            # `to` and not `next`, which is a word awk keeps for itself and
            # which this used until a dry run said so.
            awk -v to="$next" '
              /^\[workspace\.package\]/{s=1}
              /^\[/{ if ($0 != "[workspace.package]") s=0 }
              s && /^version[[:space:]]*=/ && !done { print "version = \"" to "\""; done=1; next }
              { print }
            ' Cargo.toml > Cargo.toml.next
            mv Cargo.toml.next Cargo.toml
            grep -q "version = \"$next\"" Cargo.toml

            # The lock carries every one of our crates at that number too.
            cargo metadata --format-version 1 --quiet > /dev/null

            # `|| true` after the filter: a day whose changes are all labelled
            # something else has no line to show, and under `pipefail` an
            # empty `grep` ended the step before the version was written.
            {
              echo "chore: $next, for what changed since v$WAS"
              echo
              printf '%s commits since v%s:\n' \
                "$(git log "v$WAS"..HEAD --no-merges --oneline | wc -l | tr -d ' ')" "$WAS"
              echo
              git log "v$WAS"..HEAD --no-merges --format=%s \
                | sed 's/[(:].*//' | sort | uniq -c | sort -rn \
                | awk '{printf "  %s %s\n", $1, $2}'
              echo
              echo "What is different in the programs:"
              echo
              git log "v$WAS"..HEAD --no-merges --format=%s \
                | { grep -E '^(feat|fix|perf)(\(|!|:)' || true; } \
                | sed 's/^/  /'
            } > message.txt
            cat message.txt

            git -c user.name="cairn releases" \
                -c user.email="releases@cairnchain.org" \
                commit -q -a -F message.txt
            # Guarded, because this script is worth running by hand before it
            # is trusted and a script that pushes when it is read is not. A dry
            # run sets CAIRN_DRY_RUN and gets everything but the branch moving.
            # The first dry run of it pushed a version bump onto a clone's
            # origin, which was somebody's working copy.
            if [ -n "${CAIRN_DRY_RUN:-}" ]; then
              echo "a dry run: the branch is left where it was"
              break
            fi
            if git push origin HEAD:main; then
              break
            fi
            # Refused. Tried again only when main has moved, which is the one
            # refusal writing the version again can mend; anything else would
            # be refused again, and is said.
            git fetch --quiet origin main
            if [ "$(git rev-parse origin/main)" = "$(git rev-parse HEAD^)" ]; then
              echo "the push was refused and main is still where the version was written on, so it was refused for another reason; no version is written" >&2
              exit 1
            fi
            if [ "$attempt" -ge 5 ]; then
              echo "main moved under $attempt pushes running; no version is written, and the next scheduled run tries again" >&2
              exit 1
            fi
            echo "main moved between reading it and pushing; writing the version again on the new tip"
          done
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$next" >> "$GITHUB_OUTPUT"

      # With no version, so that the run is asked what a push is asked: it
      # finds v<next> without a release and makes it, from the commit main is
      # at when it starts. That is the version commit, or a commit merged on
      # top of it in the seconds between, which the release then carries too.
      - name: Start the run that releases it
        if: steps.write.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.write.outputs.sha }}
          VERSION: ${{ steps.write.outputs.version }}
        run: |
          set -euo pipefail
          workflow=${GITHUB_WORKFLOW_REF%@*}
          workflow=${workflow##*/}
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/dispatches" \
            -f ref=main
          echo "::notice::v$VERSION is written on main as $SHA, and the run that releases it has been started"

  build:
    needs: [decide, verify]
    # An ordinary push builds nothing here. The checks that run on every commit
    # are a different file; this one exists to make what people download. Nor
    # does a scheduled run that writes a version: the run it starts builds it.
    if: needs.decide.outputs.release == 'true' || needs.decide.outputs.dry == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-apple-silicon
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-intel
            os: macos-latest
            target: x86_64-apple-darwin
          # musl rather than glibc: a binary linked against the glibc of the
          # machine that built it refuses to start on an older one, which is
          # exactly the machine a cheap server is.
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      # A release has to be one commit built five times, and it is the commit
      # this run was started for: the one `verify` checked, the one the
      # attestation below will name, and the one the tag goes on. The default
      # ref, and nothing else.
      #
      # It was the version commit a scheduled run had just made, checked out by
      # name, one commit above the one this run was started for. The build
      # vouched that the two differed in version numbers only, and they did,
      # but the attestation is GitHub's account of the run and named the
      # commit below: every scheduled release was attested as built from a
      # tree whose Cargo.toml gives the version before. A version commit is
      # released now by a run started for it (see `bump`), so there is no
      # other commit to name here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install the toolchain this repository pins
        run: rustup show

      - run: rustup target add ${{ matrix.target }}

      - name: Install the musl linker
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools

      # --locked so the release is built from the dependency versions in
      # Cargo.lock and not from whatever resolved newest this morning.
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --bin cairnd --bin cairn-wallet --bin cairn-explorer

      - name: Gather what goes in the archive
        shell: bash
        run: |
          # A dispatch is a dry run only when it names a version: the one a
          # scheduled run starts names none, and releases the version on main.
          version="${{ needs.decide.outputs.version }}"
          if [ "${{ needs.decide.outputs.dry }}" = "true" ]; then
            version="${{ inputs.version }}"
          fi
          # The folder carries the version; the archive does not, so the
          # link on the website never has to be edited again.
          folder="cairn-${version}-${{ matrix.name }}"
          echo "FOLDER=$folder" >> "$GITHUB_ENV"
          echo "ARCHIVE=cairn-${{ matrix.name }}" >> "$GITHUB_ENV"
          mkdir "$folder"
          suffix=""
          if [ "${{ runner.os }}" = "Windows" ]; then
            suffix=".exe"
          fi
          for program in cairnd cairn-wallet cairn-explorer; do
            cp "target/${{ matrix.target }}/release/${program}${suffix}" "$folder/"
          done
          cp LICENSE-MIT LICENSE-APACHE "$folder/"
          cp deploy/DOWNLOAD.txt "$folder/README.txt"
          printf '%s\n' "$version" > "$folder/VERSION"

      - name: Archive
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "${ARCHIVE}.zip" "$FOLDER" > /dev/null
          else
            tar czf "${ARCHIVE}.tar.gz" "$FOLDER"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.name }}
          path: |
            *.tar.gz
            *.zip
          if-no-files-found: error

  publish:
    needs: [decide, build]
    # The condition `build` carries: a job whose dependencies all succeeded,
    # on a run that releases or is a dry run.
    if: needs.decide.outputs.release == 'true' || needs.decide.outputs.dry == 'true'
    runs-on: ubuntu-latest
    # The only job that writes anything: the release, and the attestation that
    # says which build produced it.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # The commit the machines built, for the same reason they build it: what
      # is tagged and published has to be what was built and what the
      # attestation names, and the notes have to describe what is tagged.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The commit that changed the version becomes the release notes and
          # the tag's message, so the whole history has to be here.
          fetch-depth: 0

      # The attestation names the commit this run was started for, whatever is
      # checked out, and the tag goes on what is checked out. They are the same
      # commit or nothing is published. And that commit is the version the
      # release is named after, so the programs inside say what the tag says.
      - name: The commit this release is
        shell: bash
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          here=$(git rev-parse HEAD)
          if [ "$here" != "$GITHUB_SHA" ]; then
            echo "this machine has $here and the attestation will name $GITHUB_SHA; nothing is published" >&2
            exit 1
          fi
          holds=$(awk '/^\[workspace\.package\]/{s=1;next} /^\[/{s=0} s && /^version[[:space:]]*=/{split($0,a,"\"");print a[2];exit}' Cargo.toml)
          if [ "$holds" != "$VERSION" ]; then
            echo "$here holds version $holds and the release is v$VERSION; nothing is published" >&2
            exit 1
          fi
          echo "releasing $here, which holds v$VERSION"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: downloads
          merge-multiple: true

      # One file listing every archive and its hash, so a download can be
      # checked with a command every operating system already has.
      - name: Write the checksums
        working-directory: downloads
        run: |
          sha256sum *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS

      # Signed by GitHub, tying each file to this commit and this workflow.
      # Verified with:
      #   gh attestation verify <file> --repo ${{ github.repository }}
      # Recorded in a public transparency log, so only for a real release.
      #
      # The list of hashes as well. It is uploaded with the same token as the
      # archives, so unattested it caught a download that went wrong and not
      # one that was swapped, while the notes offered it as the same check.
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        id: attest
        if: needs.decide.outputs.release == 'true'
        with:
          subject-path: "downloads/*.tar.gz, downloads/*.zip, downloads/SHA256SUMS"

      # Read back from the attestation itself, before anything is tagged: the
      # commit it names is the commit about to be tagged and published. The
      # download notes tell people this is what the attestation says, and for
      # every scheduled release until this was read it was not.
      - name: The commit the attestation names
        if: needs.decide.outputs.release == 'true'
        shell: bash
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          here=$(git rev-parse HEAD)
          named=$(jq -r '.dsseEnvelope.payload' "$BUNDLE" \
            | while read -r payload; do
                printf '%s' "$payload" | base64 -d \
                  | jq -r '.predicate.buildDefinition.resolvedDependencies[].digest.gitCommit // empty'
              done | sort -u)
          if [ "$named" != "$here" ]; then
            echo "the attestation names ${named:-no commit} and the release is $here; nothing is tagged or published" >&2
            exit 1
          fi
          echo "the attestation names $here, the commit built and about to be tagged"

      # The commit that changed the version, followed by the same closing note
      # every time: how to check these files without having to believe anyone.
      # The commit that changed the version, found by the change rather than by
      # position. This took the newest commit instead, which is the same one
      # only when the version bump happens to be last in the push. A push that
      # bumps the version and then fixes a typo released the typo's message as
      # its notes and as its tag, and the version this repository stands at
      # today was set fifteen commits before the current head.
      #
      # And then every commit the release carries that came after it. The
      # commit released is not always the one that set the version: a push
      # that lands before the release run starts, or after a release whose
      # build failed, releases its own commit, and the version commit's
      # account stops where that commit began. It was published as the whole
      # account, and the tag said the same, of a release carrying a change it
      # did not name.
      - name: Write the release notes
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.decide.outputs.version }}"
          set_by=$(git log -S"version = \"$version\"" -1 --format='%H' -- Cargo.toml)
          if [ -z "$set_by" ]; then
            echo "could not find the commit that set version $version" >&2
            exit 1
          fi
          git log -1 --format='%B' "$set_by" > notes.md
          after=$(git log "$set_by"..HEAD --no-merges --format='  %s')
          if [ -n "$after" ]; then
            # `%B` ends in a blank line already.
            {
              echo "Merged after the version was set, and in this release too:"
              echo
              printf '%s\n' "$after"
            } >> notes.md
          fi
          cat deploy/RELEASE_FOOTER.md >> notes.md
          cat notes.md

      # Made here rather than by hand, from the number the release is named
      # after, so a tag cannot name one version over programs reporting
      # another. Annotated with the notes: the commit that asked for the
      # release, and whatever it carries that came after.
      - name: Tag it
        if: needs.decide.outputs.release == 'true'
        run: |
          version="${{ needs.decide.outputs.version }}"
          git -c user.name="cairn releases" -c user.email="releases@cairnchain.org" \
            tag -a "v$version" -F notes.md
          git push origin "v$version"

      - name: Publish
        if: needs.decide.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ needs.decide.outputs.version }}"
          gh release create "v$version" \
            --repo "$GITHUB_REPOSITORY" \
            --title "v$version" \
            --notes-file notes.md \
            downloads/*
