# Whether the tests would notice if the code were wrong.
#
# A green suite says nothing until you know what it can see. This repository
# has spent weeks finding, by hand, tests that could not fail: a guard reading
# its own condition back out of the error it produced, a fixture that topped
# out before the boundary it was aimed at, a comparison of an empty list
# against an empty list, an expected value that was the constant the code was
# written against. Every one was found by putting the defect back and watching
# the suite stay green, one at a time, by a person.
#
# `cargo mutants` does that by machine. It breaks the code one edit at a time
# and reports every edit the suite did not notice, and there are thousands of
# such edits here. The figure is not written down, because it moves with every
# commit and a number written into a comment does not: the `plan` job below
# prints it at the top of every weekly run. It said 4 336 here for one day and
# was 4 398 by the end of it. The first four minutes of it, on the smallest
# crate, found that
# the only test holding the hash counter asserted the counter read nought — so
# a counter answering nought to everything passed it, and every
# `assert!(cost < n)` in four audit files across three crates holds when every
# count is nought. That is the number this project's central claim is measured
# in.
#
# Kept out of check.yml deliberately, as fuzz.yml and audit.yml are: a check
# that runs on every push has to finish in the time somebody will wait for it,
# and the full run here is hours.
#
# The tests are run per crate rather than across the workspace, which is the
# one compromise in this file and is worth stating. Running the whole suite
# against every mutant would be twenty minutes times four thousand. So a
# mutant in a crate is put only to that crate's own tests, and one that only
# a dependent crate would have caught reads here as a survivor. That is not
# purely a false alarm: a crate that does not hold its own behaviour is
# relying on whoever happens to be built alongside it, which is how the one
# test guarding the hash counter came to exist only when another crate's
# dev-dependencies turned its feature on.

name: mutants

on:
  pull_request:
  schedule:
    # Sunday, so the week's findings are waiting on Monday rather than
    # arriving in the middle of it.
    - cron: "0 3 * * 0"
  workflow_dispatch:

# Nothing here writes anything.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # How many ways the weekly run is split. Written once: the shard numbers and
  # the coverage check below are both built from it, because they were written
  # out separately and disagreed.
  #
  # Was eight, which is a number nobody had run. The first full run measured
  # it: the quickest shard took two hours and forty four minutes and three of
  # the eight were still going at five hours and six, against a platform limit
  # of six, where a job is killed and takes its findings with it. A weekly run
  # that cannot be relied on to finish is a weekly run that reports nothing,
  # and it would have failed that way silently, since a killed shard and a
  # shard full of survivors are both a red job.
  #
  # Twenty four was meant to put the longest of those near a hundred minutes,
  # and the first run of it did not: its shards took from ten minutes to past
  # five hours. The split was not the one this file described. See SHARDING.
  SHARDS: 24
  # How the mutants are dealt to the shards.
  #
  # This file said round-robin, and cargo-mutants' default is `slice`: the
  # first twenty fourth of the list to shard 0, and so on, in source order. So
  # a shard was a stretch of one or two files, and a file's cost is its suite's.
  # Shard 16 of the first run was 185 mutants of `cairn-net/src/node.rs`, each
  # up to seven minutes of tests, and it was stopped at the deadline with 160
  # played; shard 19 was done in ten minutes. Round-robin gives every shard a
  # twenty fourth of every file, so no shard is the one that holds the node.
  #
  # Written once, because the coverage check in `plan` has to deal the same
  # way the shards do or it checks a split nobody ran.
  SHARDING: round-robin
  # Which cargo-mutants. It was whatever was newest on the day, which is a
  # weekly run whose list of mutants, names and default split can change
  # between two Sundays with nothing in this repository changing. It did
  # change once already: the split this file assumed is not the default.
  CARGO_MUTANTS: 27.1.0
  # A ceiling on the memory of every test binary, and of nothing else: cargo
  # starts test binaries through the target's runner, and the compiler is not
  # one of them.
  #
  # cargo-mutants' timeout stops a mutant that spins. It does not stop one
  # that allocates, and one did: turning a comparison round in the loop that
  # writes roman figures made it write "M" until the runner had no memory
  # left. The machine went down with every result on it, twice, and it read
  # as GitHub shutting a runner down, which `mutants-retry.yml` would have
  # answered by running it again into the same wall. Under this ceiling the
  # test binary dies alone, its test fails, and the mutant counts as caught.
  #
  # Four gigabytes, because the whole workspace suite runs under it with the
  # profile these jobs build, measured on this runner, and two test binaries
  # at a time at the ceiling still leave the machine room. Both triples, so
  # that a runner image changing architecture does not drop the ceiling
  # without a word.
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: prlimit --as=4294967296 --
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: prlimit --as=4294967296 --

jobs:
  # What this change would let through. Only the mutants that fall on lines
  # the pull request touched, which is a handful, so this can block.
  #
  # This is the job that matters day to day. The weekly run below says what is
  # already wrong; this one says the class of defect cannot be added again
  # without somebody deciding to.
  changed:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The whole history, because the diff this job mutates is against
          # the branch being merged into.
          fetch-depth: 0
      - name: Install the toolchain this repository pins
        run: rustup show
      # Built from source rather than fetched by a third-party action, for the
      # same reason audit.yml builds cargo-audit: a job about whether this
      # repository's guards hold should not answer it by trusting one more
      # thing nobody here has read.
      - name: Install cargo-mutants
        run: cargo install --locked "cargo-mutants@$CARGO_MUTANTS"
      - name: What this change touched
        run: |
          git diff "origin/${{ github.base_ref }}"...HEAD > pr.diff
          # Held, not printed. `cargo mutants --in-diff` on a diff that names
          # no file answers "Diff changes no Rust source files" and exits
          # zero, so an empty or mangled diff is a green gate that tested
          # nothing. That happened twice in a day locally, where a tool that
          # summarises `git diff` into a table of counts was in the way, and
          # the only thing that caught it was counting the `+++` lines by
          # hand. A pull request that changes nothing at all does not exist,
          # so nothing here is a fault of this step rather than the change.
          lines=$(wc -l < pr.diff)
          files=$(grep -c '^+++' pr.diff || true)
          echo "$lines lines, $files files"
          test "$lines" -gt 0 || {
            echo "the diff is empty, so the gate below would pass having" \
                 "tested nothing" >&2
            exit 1
          }
      - name: Mutants on the lines this change touched
        run: |
          # `--in-place` rather than a copy of the tree, so the build this
          # job already paid for is the one every mutant reuses. It cannot be
          # combined with `--jobs`: one tree cannot be built two ways at once.
          #
          # The test timeout is derived from the unmutated run rather than
          # stated. It was stated, at three minutes, and `cairn-ledger`'s own
          # suite takes longer than that on this machine, so the baseline
          # timed out and the job reported that no mutants could be tested —
          # a number written from the outside, against a suite whose length is
          # not this file's to know. The floor is here only so a crate whose
          # tests take a second does not get a one second budget.
          cargo mutants --in-diff pr.diff \
            --test-workspace=false \
            --minimum-test-timeout 120 \
            --in-place
      - name: The survivors, if any
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutants-in-diff
          path: mutants.out/

  # Which shards there are, and that together they are every mutant.
  #
  # `--shard k/n` takes k from zero. This file shipped with one to eight, so
  # `8/8` was rejected outright and that job failed in no time at all on every
  # run, while `0/8` was never asked for: an eighth of the mutants went
  # untested, behind a red job that read like a finding. A sharding that
  # silently drops a slice is the exact defect this workflow exists to catch,
  # written into the workflow.
  #
  # So the numbers are built from `SHARDS` rather than typed out, and the step
  # below holds that the shards add up to the whole list. Listing does not
  # build or test anything, so this costs a minute and answers a question no
  # amount of reading the matrix would.
  plan:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.shards.outputs.list }}
      sizes: ${{ steps.cover.outputs.sizes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the toolchain this repository pins
        run: rustup show
      - name: Install cargo-mutants
        run: cargo install --locked "cargo-mutants@$CARGO_MUTANTS"
      - name: The shard numbers
        id: shards
        run: |
          list=$(seq 0 $((SHARDS - 1)) | jq -cRs 'split("\n")[:-1]')
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "$list"
      - name: Every mutant is in exactly one shard
        id: cover
        # Without colour, because this step is a comparison of two listings and
        # escape codes are the sort of thing that makes two identical lines
        # differ.
        env:
          CARGO_TERM_COLOR: never
        run: |
          cargo mutants --list | sort > all.txt
          : > covered.txt
          : > sizes.txt
          for k in $(seq 0 $((SHARDS - 1))); do
            cargo mutants --shard "$k/$SHARDS" --sharding "$SHARDING" --list > shard.txt
            cat shard.txt >> covered.txt
            wc -l < shard.txt >> sizes.txt
          done
          sort -o covered.txt covered.txt
          diff all.txt covered.txt
          echo "$(wc -l < all.txt) mutants, all of them in a shard"
          # How many each shard holds, so `whole` can tell a shard that played
          # all of its mutants from one that was stopped partway.
          echo "sizes=$(jq -cs . sizes.txt)" >> "$GITHUB_OUTPUT"

  # Everything, once a week, so the standing figure is a number and not a
  # feeling. Sharded because one machine takes hours, and dealt round-robin so
  # each shard gets a spread of every file rather than one large one.
  #
  # A shard is green when it played every mutant it was dealt, whatever it
  # found. It was red whenever anything survived, which is every week and will
  # be for a long time, so red said nothing: the first run lost one shard to a
  # runner GitHub shut down and another to the deadline, and both looked like
  # the twenty two that had simply found survivors. What was found is a number,
  # and `whole` below reports it; red is kept for a shard that did not finish,
  # which is the one thing somebody has to act on.
  everything:
    needs: plan
    if: github.event_name != 'pull_request'
    # Far past the work, because this is a deadline for something that has to
    # happen: met, it costs nothing. What it buys is that a shard which will
    # not finish says so as itself, rather than being killed at the platform's
    # six hours.
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the toolchain this repository pins
        run: rustup show
      - name: Install cargo-mutants
        run: cargo install --locked "cargo-mutants@$CARGO_MUTANTS"
      - name: One shard of the mutants
        run: |
          # A copy per job here rather than `--in-place`, because this run is
          # hundreds of mutants and two at a time is worth more than the build
          # `--in-place` saves. The two flags are mutually exclusive.
          #
          # cargo-mutants exits 2 when a mutant survived and 3 when one timed
          # out. Both are what this run is for, not a failure of it.
          #
          # A mutant's tests are given as long as the unmutated run took, not
          # five times as long, which is cargo-mutants' default. That run
          # tests every crate the shard holds, and dealt round-robin a shard
          # holds all of them, so it takes about eighteen minutes, and five
          # times that is what the first run dealt this way set: 5 099 to
          # 5 356 seconds. A mutant is tested against its own crate only, the
          # longest of which takes about seven minutes, so each mutant that
          # hangs a test was waited out for an hour and a half, and a shard
          # that drew three of them ran four hours twenty one against a
          # deadline of five. One crate's suite has no business taking longer
          # than every crate's together.
          #
          # A multiplier and not a stated number: a stated `--timeout` bounds
          # the unmutated run as well, and eighteen minutes on a slow runner
          # is close enough to any round figure to fail a shard before it has
          # tested anything.
          cargo mutants \
            --shard "${{ matrix.shard }}/$SHARDS" \
            --sharding "$SHARDING" \
            --test-workspace=false \
            --timeout-multiplier 1 \
            --minimum-test-timeout 120 \
            -j 2 || {
            status=$?
            test "$status" -eq 2 || test "$status" -eq 3 || exit "$status"
          }
      - name: The survivors, which are the point of this run
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: mutants.out/
          # A shard run again after a runner was lost replaces what the lost
          # one managed to upload, rather than failing on the name.
          overwrite: true

  # Whether the week was measured, and what it found.
  #
  # Each shard knows only its own share, so nothing said whether the whole list
  # had been played. The first run was missing a shard outright, since a runner
  # that is shut down uploads nothing, and one shard was a hundred and sixty of
  # a hundred and eighty five; neither was visible without downloading every
  # artifact and counting. This counts: every shard has to be there, finished,
  # with as many mutants played as `plan` dealt it. It fails naming the ones
  # that are not, and `mutants-retry.yml` runs those again.
  whole:
    needs: [plan, everything]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: mutants-shard-*
          path: shards
      - name: Every shard finished, and what they found together
        env:
          SIZES: ${{ needs.plan.outputs.sizes }}
        run: |
          python3 - <<'EOF'
          import collections, json, os, pathlib, sys

          sizes = json.loads(os.environ["SIZES"])
          short = []
          outcomes = collections.Counter()
          missed = []
          timed_out = []
          for shard, size in enumerate(sizes):
              path = pathlib.Path(f"shards/mutants-shard-{shard}/outcomes.json")
              if not path.exists():
                  short.append(f"shard {shard}: no results at all")
                  continue
              report = json.loads(path.read_text())
              played = [o for o in report["outcomes"] if "Mutant" in o["scenario"]]
              if report.get("end_time") is None or len(played) != size:
                  short.append(f"shard {shard}: {len(played)} of {size} played")
              for o in played:
                  outcomes[o["summary"]] += 1
                  name = o["scenario"]["Mutant"]["name"]
                  if o["summary"] == "MissedMutant":
                      missed.append(name)
                  elif o["summary"] == "Timeout":
                      timed_out.append(name)

          pathlib.Path("missed.txt").write_text("".join(n + "\n" for n in sorted(missed)))
          pathlib.Path("timeout.txt").write_text("".join(n + "\n" for n in sorted(timed_out)))
          files = collections.Counter(n.split(":")[0] for n in missed)
          lines = [
              f"## {sum(sizes)} mutants, {sum(outcomes.values())} played",
              "",
              "| caught | missed | timed out | unviable |",
              "|---:|---:|---:|---:|",
              f"| {outcomes['CaughtMutant']} | {outcomes['MissedMutant']} "
              f"| {outcomes['Timeout']} | {outcomes['Unviable']} |",
              "",
              "Missed means missed by the tests of the mutant's own crate. One "
              "that a crate depending on it would catch is counted here too, so "
              "this is a ceiling on what nothing in the workspace notices.",
              "",
              "| file | missed |",
              "|---|---:|",
          ] + [f"| `{f}` | {n} |" for f, n in files.most_common()]
          if short:
              lines += ["", "### Not measured", ""] + [f"- {s}" for s in short]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          if short:
              sys.exit(1)
          EOF
      - name: Every survivor, in one place
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutants-whole
          path: |
            missed.txt
            timeout.txt
          overwrite: true
