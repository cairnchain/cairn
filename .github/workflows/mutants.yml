# Whether the tests would notice if the code were wrong.
#
# A green suite says nothing until you know what it can see. This repository
# has spent weeks finding, by hand, tests that could not fail: a guard reading
# its own condition back out of the error it produced, a fixture that topped
# out before the boundary it was aimed at, a comparison of an empty list
# against an empty list, an expected value that was the constant the code was
# written against. Every one was found by putting the defect back and watching
# the suite stay green, one at a time, by a person.
#
# `cargo mutants` does that by machine. It breaks the code one edit at a time
# and reports every edit the suite did not notice, and there are thousands of
# such edits here. The figure is not written down, because it moves with every
# commit and a number written into a comment does not: the `plan` job below
# prints it at the top of every weekly run. It said 4 336 here for one day and
# was 4 398 by the end of it. The first four minutes of it, on the smallest
# crate, found that
# the only test holding the hash counter asserted the counter read nought — so
# a counter answering nought to everything passed it, and every
# `assert!(cost < n)` in four audit files across three crates holds when every
# count is nought. That is the number this project's central claim is measured
# in.
#
# Kept out of check.yml deliberately, as fuzz.yml and audit.yml are: a check
# that runs on every push has to finish in the time somebody will wait for it,
# and the full run here is hours.
#
# The tests are run per crate rather than across the workspace, which is the
# one compromise in this file and is worth stating. Running the whole suite
# against every mutant would be twenty minutes times four thousand. So a
# mutant in a crate is put only to that crate's own tests, and one that only
# a dependent crate would have caught reads here as a survivor. That is not
# purely a false alarm: a crate that does not hold its own behaviour is
# relying on whoever happens to be built alongside it, which is how the one
# test guarding the hash counter came to exist only when another crate's
# dev-dependencies turned its feature on.

name: mutants

on:
  pull_request:
  schedule:
    # Sunday, so the week's findings are waiting on Monday rather than
    # arriving in the middle of it.
    - cron: "0 3 * * 0"
  workflow_dispatch:

# Nothing here writes anything.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # How many ways the weekly run is split. Written once: the shard numbers and
  # the coverage check below are both built from it, because they were written
  # out separately and disagreed.
  SHARDS: 8

jobs:
  # What this change would let through. Only the mutants that fall on lines
  # the pull request touched, which is a handful, so this can block.
  #
  # This is the job that matters day to day. The weekly run below says what is
  # already wrong; this one says the class of defect cannot be added again
  # without somebody deciding to.
  changed:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The whole history, because the diff this job mutates is against
          # the branch being merged into.
          fetch-depth: 0
      - name: Install the toolchain this repository pins
        run: rustup show
      # Built from source rather than fetched by a third-party action, for the
      # same reason audit.yml builds cargo-audit: a job about whether this
      # repository's guards hold should not answer it by trusting one more
      # thing nobody here has read.
      - name: Install cargo-mutants
        run: cargo install --locked cargo-mutants
      - name: What this change touched
        run: |
          git diff "origin/${{ github.base_ref }}"...HEAD > pr.diff
          # Held, not printed. `cargo mutants --in-diff` on a diff that names
          # no file answers "Diff changes no Rust source files" and exits
          # zero, so an empty or mangled diff is a green gate that tested
          # nothing. That happened twice in a day locally, where a tool that
          # summarises `git diff` into a table of counts was in the way, and
          # the only thing that caught it was counting the `+++` lines by
          # hand. A pull request that changes nothing at all does not exist,
          # so nothing here is a fault of this step rather than the change.
          lines=$(wc -l < pr.diff)
          files=$(grep -c '^+++' pr.diff || true)
          echo "$lines lines, $files files"
          test "$lines" -gt 0 || {
            echo "the diff is empty, so the gate below would pass having" \
                 "tested nothing" >&2
            exit 1
          }
      - name: Mutants on the lines this change touched
        run: |
          # `--in-place` rather than a copy of the tree, so the build this
          # job already paid for is the one every mutant reuses. It cannot be
          # combined with `--jobs`: one tree cannot be built two ways at once.
          #
          # The test timeout is derived from the unmutated run rather than
          # stated. It was stated, at three minutes, and `cairn-ledger`'s own
          # suite takes longer than that on this machine, so the baseline
          # timed out and the job reported that no mutants could be tested —
          # a number written from the outside, against a suite whose length is
          # not this file's to know. The floor is here only so a crate whose
          # tests take a second does not get a one second budget.
          cargo mutants --in-diff pr.diff \
            --test-workspace=false \
            --minimum-test-timeout 120 \
            --in-place
      - name: The survivors, if any
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutants-in-diff
          path: mutants.out/

  # Which shards there are, and that together they are every mutant.
  #
  # `--shard k/n` takes k from zero. This file shipped with one to eight, so
  # `8/8` was rejected outright and that job failed in no time at all on every
  # run, while `0/8` was never asked for: an eighth of the mutants went
  # untested, behind a red job that read like a finding. A sharding that
  # silently drops a slice is the exact defect this workflow exists to catch,
  # written into the workflow.
  #
  # So the numbers are built from `SHARDS` rather than typed out, and the step
  # below holds that the shards add up to the whole list. Listing does not
  # build or test anything, so this costs a minute and answers a question no
  # amount of reading the matrix would.
  plan:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.shards.outputs.list }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the toolchain this repository pins
        run: rustup show
      - name: Install cargo-mutants
        run: cargo install --locked cargo-mutants
      - name: The shard numbers
        id: shards
        run: |
          list=$(seq 0 $((SHARDS - 1)) | jq -cRs 'split("\n")[:-1]')
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "$list"
      - name: Every mutant is in exactly one shard
        # Without colour, because this step is a comparison of two listings and
        # escape codes are the sort of thing that makes two identical lines
        # differ.
        env:
          CARGO_TERM_COLOR: never
        run: |
          cargo mutants --list | sort > all.txt
          : > covered.txt
          for k in $(seq 0 $((SHARDS - 1))); do
            cargo mutants --shard "$k/$SHARDS" --list >> covered.txt
          done
          sort -o covered.txt covered.txt
          diff all.txt covered.txt
          echo "$(wc -l < all.txt) mutants, all of them in a shard"

  # Everything, once a week, so the standing figure is a number and not a
  # feeling. Sharded because one machine takes hours: the shards are
  # round-robin, so each gets a spread of crates rather than one large one.
  everything:
    needs: plan
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install the toolchain this repository pins
        run: rustup show
      - name: Install cargo-mutants
        run: cargo install --locked cargo-mutants
      - name: One shard of the mutants
        run: |
          # A copy per job here rather than `--in-place`, because this run is
          # hundreds of mutants and two at a time is worth more than the build
          # `--in-place` saves. The two flags are mutually exclusive.
          cargo mutants \
            --shard "${{ matrix.shard }}/$SHARDS" \
            --test-workspace=false \
            --minimum-test-timeout 120 \
            -j 2
      - name: The survivors, which are the point of this run
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: mutants.out/
