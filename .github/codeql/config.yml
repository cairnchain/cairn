# What CodeQL is pointed at, and what it is not.
#
# Default setup analyses everything, which sounds right and is not: this
# workspace is about a third test code by line, and test code is written to be
# reproducible rather than secret. Every fixture key is `[7; 32]`, every seed is
# a counter, every nonce a miner searches upward from is nought. CodeQL reads
# each of those as a hard-coded cryptographic value, correctly by its own
# definition and uselessly by ours: three hundred and eight alerts were raised
# against this repository and exactly one was a defect, in `crates/cairn-wallet`
# and now repaired.
#
# That ratio is the problem to fix, not the alerts. An alert list nobody reads
# is worse than no alert list, and a check that turns red on every pull request
# that adds a test teaches everyone to merge over it. So the analysis is pointed
# away from the files that are only tests.
#
# Only the files. This is the half of the problem `paths-ignore` can reach, and
# it is not the larger half: `paths-ignore` matches paths, and a unit test in
# this workspace lives inside the file it tests, behind `#[cfg(test)]`. Nearly
# a third of the lines under `crates/*/src` sit after the first of those, and
# `cairn-net/src/node.rs` is seven thousand lines of test module under fifteen
# hundred lines of node. All of it is read here, fixture keys and counted seeds
# and all.
#
# It is not theoretical. The two most recent alerts against this repository,
# both `rust/hard-coded-cryptographic-value`, are at `cairn-chain/src/lib.rs`
# lines 3 580 and 3 719, and that file's test module opens at 3 013. They are a
# block identifier and a difficulty in a fixture, they were dismissed by hand,
# and the next ones will be too.
#
# Nothing here fixes that, because there is nothing in this file that can:
# an alert cannot be excluded for sitting inside a `cfg` module, and with
# `build-mode: none` the extractor never evaluates one. Moving those tests out
# is not the answer either, since what they reach is private. So the ratio is
# better than it was and is not solved, and this is written down so the next
# person tuning it starts from that rather than from the sentence above.
#
# What the exclusion gives up, said plainly: a real defect written into a test
# file will not be found here. Test code is not shipped, is not reachable by a
# stranger, and holds nothing worth taking, so that is a trade rather than a
# hole. The rules themselves are untouched, so anything new in `src` is still
# read, which is also why the test modules inside `src` still are.
name: cairn

paths-ignore:
  - "**/tests/**"
  - "**/examples/**"
  - "**/benches/**"

# `web/` is not on that list, and the first version of this file had it there.
# The argument above is that test code is not shipped and no stranger reaches
# it. The site is the opposite of both: it is served to anybody who asks, its
# script reads from a node's explorer and writes what it finds into a page, and
# that is exactly the shape the JavaScript queries are written for. Excluding
# it was reaching for the same reason where the reason does not hold.
#
# The analysis said so itself, which is worth writing down: with `web/` ignored
# there was no JavaScript left in the repository at all, and the run failed
# rather than passing on an empty database. A configuration that silently
# analysed nothing would have looked exactly like one that analysed everything
# and found nothing.
